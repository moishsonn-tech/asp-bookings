<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#C8952E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ASP Bookings" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme: light;
  --page:#EEEEF1; --surface:#FFFFFF; --surface-2:#F8F8FA; --surface-3:#E6E6EA;
  --ink:#17171A; --ink-2:#67676D; --ink-3:#9A9AA1;
  --border:#E1E1E6; --border-strong:#D1D1D8;
  --accent:#C8952E; --accent-hover:#AD7E22; --accent-wash:#F2E7CE; --accent-ink:#7A5518;
  --good:#1F8A54; --good-wash:#E5F5EC; --good-ink:#146B3F;
  --warn:#C6860B; --warn-wash:#FFF2D6; --warn-ink:#8F5E0A;
  --crit:#D64444; --crit-wash:#FDE9E9; --crit-ink:#A32E2E;
  --cat-1:#2a78d6; --cat-2:#1a8a1a; --cat-3:#e87ba4; --cat-4:#c98100; --cat-5:#1baf7a; --cat-6:#eb6834; --cat-7:#4a3aa7;
  --shadow-sm:0 1px 2px rgba(20,20,26,.05),0 1px 1px rgba(20,20,26,.03);
  --shadow-md:0 10px 28px rgba(20,20,26,.08),0 2px 6px rgba(20,20,26,.04);
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#14161C; --surface:#1C2029; --surface-2:#232733; --surface-3:#2B303D;
    --ink:#F5F4EF; --ink-2:#C2C4CC; --ink-3:#8C8F99;
    --border:#333947; --border-strong:#414858;
    --accent:#E6B85C; --accent-hover:#F0C878; --accent-wash:#463519; --accent-ink:#F0D18F;
    --good:#3CC989; --good-wash:#173420; --good-ink:#8CEBB8;
    --warn:#F0B94A; --warn-wash:#3F2F10; --warn-ink:#F5CE7E;
    --crit:#F07A7A; --crit-wash:#3F1C1C; --crit-ink:#F5A8A8;
    --cat-1:#3987e5; --cat-2:#2fa32f; --cat-3:#d55181; --cat-4:#c98500; --cat-5:#199e70; --cat-6:#d95926; --cat-7:#9085e9;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#14161C; --surface:#1C2029; --surface-2:#232733; --surface-3:#2B303D;
  --ink:#F5F4EF; --ink-2:#C2C4CC; --ink-3:#8C8F99;
  --border:#333947; --border-strong:#414858;
  --accent:#E6B85C; --accent-hover:#F0C878; --accent-wash:#463519; --accent-ink:#F0D18F;
  --good:#3CC989; --good-wash:#173420; --good-ink:#8CEBB8;
  --warn:#F0B94A; --warn-wash:#3F2F10; --warn-ink:#F5CE7E;
  --crit:#F07A7A; --crit-wash:#3F1C1C; --crit-ink:#F5A8A8;
  --cat-1:#3987e5; --cat-2:#2fa32f; --cat-3:#d55181; --cat-4:#c98500; --cat-5:#199e70; --cat-6:#d95926;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 28px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  color-scheme: light;
  --page:#EEEEF1; --surface:#FFFFFF; --surface-2:#F8F8FA; --surface-3:#E6E6EA;
  --ink:#17171A; --ink-2:#67676D; --ink-3:#9A9AA1;
  --border:#E1E1E6; --border-strong:#D1D1D8;
  --accent:#C8952E; --accent-hover:#AD7E22; --accent-wash:#F2E7CE; --accent-ink:#7A5518;
  --good:#1F8A54; --good-wash:#E5F5EC; --good-ink:#146B3F;
  --warn:#C6860B; --warn-wash:#FFF2D6; --warn-ink:#8F5E0A;
  --crit:#D64444; --crit-wash:#FDE9E9; --crit-ink:#A32E2E;
  --cat-1:#2a78d6; --cat-2:#1a8a1a; --cat-3:#e87ba4; --cat-4:#c98100; --cat-5:#1baf7a; --cat-6:#eb6834; --cat-7:#4a3aa7;
  --shadow-sm:0 1px 2px rgba(20,20,26,.05),0 1px 1px rgba(20,20,26,.03);
  --shadow-md:0 10px 28px rgba(20,20,26,.08),0 2px 6px rgba(20,20,26,.04);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:inherit;}
::selection{background:var(--accent-wash); color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.u-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:600; }
.u-mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.u-scroll-x{ overflow-x:auto; overflow-y:hidden; }
.card.u-scroll-x{ overflow:hidden auto; }

/* ============ WORDMARK ============ */
.mark{ display:inline-flex; align-items:flex-end; gap:2px; height:18px; }
.mark i{ display:block; width:3px; background:var(--accent); border-radius:2px; animation:bar 1.6s ease-in-out infinite; }
.mark i:nth-child(1){height:40%; animation-delay:-1.1s;}
.mark i:nth-child(2){height:100%; animation-delay:-.4s;}
.mark i:nth-child(3){height:65%; animation-delay:-1.4s;}
.mark i:nth-child(4){height:85%; animation-delay:-.7s;}
.mark i:nth-child(5){height:50%; animation-delay:-.2s;}
@keyframes bar{ 0%,100%{transform:scaleY(.5);} 50%{transform:scaleY(1);} }
@media (prefers-reduced-motion: reduce){ .mark i{animation:none;} }
.wordmark{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:1.25rem; font-weight:700; letter-spacing:.01em; }
.wordmark small{ display:block; font-family:var(--font-body); font-size:10px; font-weight:600; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase; margin-top:1px;}

/* ============ BUTTONS ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); padding:9px 14px; font-size:13.5px; font-weight:600; transition:.16s ease; white-space:nowrap;}
.btn:hover{ border-color:var(--ink-3); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-3); }
.btn-danger{ background:transparent; border-color:var(--crit); color:var(--crit); }
.btn-danger:hover{ background:var(--crit-wash); }
.btn-sm{ padding:6px 10px; font-size:12.5px; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:var(--r-sm); border:1px solid transparent; background:transparent; color:var(--ink-2); }
.icon-btn:hover{ background:var(--surface-3); color:var(--ink); }

/* ============ APP SHELL ============ */
#app{ min-height:100vh; }
.shell{ display:flex; min-height:100vh; }
.rail{ width:220px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 14px; gap:22px; position:sticky; top:0; height:100vh; }
.rail-nav{ display:flex; flex-direction:column; gap:2px; }
.rail-link{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-sm); color:var(--ink-2); font-size:13.5px; font-weight:600; transition:.16s ease; }
.rail-link .ico{ width:17px; height:17px; flex:none; }
.rail-link:hover{ background:var(--surface-3); color:var(--ink); }
.rail-link.active{ background:var(--accent-wash); color:var(--accent-ink); }
.rail-foot{ margin-top:auto; border-top:1px solid var(--border); padding-top:12px; }
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--page); position:sticky; top:0; z-index:5; }
.topbar h1{ font-size:1.5rem; }
.content{ padding:24px 28px 80px; flex:1; }
.user-chip{ display:flex; align-items:center; gap:8px; padding:5px 8px 5px 5px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; }

.avatar{ display:inline-flex; align-items:center; justify-content:center; border-radius:50%; font-weight:700; color:#fff; flex:none; font-family:var(--font-body); letter-spacing:.02em; }
.avatar[data-slot="1"]{ background:var(--cat-1); } .avatar[data-slot="2"]{ background:var(--cat-2); }
.avatar[data-slot="3"]{ background:var(--cat-3); } .avatar[data-slot="4"]{ background:var(--cat-4); }
.avatar[data-slot="5"]{ background:var(--cat-5); } .avatar[data-slot="6"]{ background:var(--cat-6); } .avatar[data-slot="7"]{ background:var(--cat-7); }
.dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
.dot[data-slot="1"]{ background:var(--cat-1); } .dot[data-slot="2"]{ background:var(--cat-2); }
.dot[data-slot="3"]{ background:var(--cat-3); } .dot[data-slot="4"]{ background:var(--cat-4); }
.dot[data-slot="5"]{ background:var(--cat-5); } .dot[data-slot="6"]{ background:var(--cat-6); } .dot[data-slot="7"]{ background:var(--cat-7); }

/* ============ CARDS / GRID ============ */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }
.card-pad{ padding:18px 20px; }
.grid{ display:grid; gap:16px; }
.stat-row{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
.section-head h2{ font-size:1.2rem; }
.stack{ display:flex; flex-direction:column; }

.stat-tile{ padding:18px 20px; display:flex; flex-direction:column; gap:6px; }
.stat-tile .val{ font-family:var(--font-display); font-size:2.1rem; font-weight:700; font-variant-numeric:tabular-nums; }
.stat-tile .sub{ font-size:12px; color:var(--ink-3); }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
.pill-neutral{ background:var(--surface-3); color:var(--ink-2); }
.pill-warn{ background:var(--warn-wash); color:var(--warn-ink); }
.pill-good{ background:var(--good-wash); color:var(--good-ink); }
.pill-crit{ background:var(--crit-wash); color:var(--crit-ink); }
.pill-accent{ background:var(--accent-wash); color:var(--accent-ink); }

/* ============ TABLE ============ */
table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:700; padding:12px 14px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
td{ padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
tr.row-link{ cursor:pointer; transition:.12s ease; }
tr.row-link:hover td{ background:var(--surface-2); }

/* ============ CALENDAR ============ */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.cal-nav{ display:flex; align-items:center; gap:6px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-dow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; text-align:center; padding-bottom:4px; }
.cal-cell{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); min-height:92px; padding:6px; display:flex; flex-direction:column; gap:3px; transition:.14s ease; }
.cal-cell.out{ opacity:.4; }
.cal-cell.today{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.cal-date{ font-size:12px; font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.cal-evt{ display:flex; align-items:center; gap:4px; padding:2px 5px; border-radius:4px; background:var(--surface); border:1px solid var(--border); font-size:10.5px; font-weight:600; cursor:pointer; overflow:hidden; }
.cal-evt:hover{ border-color:var(--ink-3); }
.cal-evt span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-more{ font-size:10px; color:var(--ink-3); font-weight:700; padding-left:5px; cursor:pointer; }
.legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); font-weight:600; }

/* ============ MODAL / SLIDEOVER ============ */
.overlay{ position:fixed; inset:0; background:rgba(10,8,4,.42); backdrop-filter:blur(1px); z-index:40; display:flex; justify-content:flex-end; animation:fade .16s ease; }
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.overlay.center{ justify-content:center; align-items:center; padding:20px; }
.sheet{ width:560px; max-width:100%; height:100%; background:var(--page); box-shadow:var(--shadow-md); overflow-y:auto; animation:slidein .2s ease; }
@keyframes slidein{ from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.modal{ width:520px; max-width:100%; max-height:90vh; overflow-y:auto; background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-md); animation:pop .16s ease; }
@keyframes pop{ from{transform:scale(.97); opacity:0;} to{transform:scale(1); opacity:1;} }
.sheet-head{ display:flex; align-items:flex-start; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; }
.sheet-body{ padding:20px 22px 40px; display:flex; flex-direction:column; gap:18px; }

/* ============ FORM ============ */
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); }
.field input, .field select, .field textarea{ padding:9px 11px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.artist-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.artist-opt{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 6px; border-radius:var(--r-sm); border:1.5px solid var(--border); cursor:pointer; text-align:center; }
.artist-opt span{ font-size:11px; font-weight:600; line-height:1.2; }
.artist-opt.sel{ border-color:var(--accent); background:var(--accent-wash); }

/* ============ TIMELINE ============ */
.timeline{ display:flex; align-items:flex-start; gap:0; overflow-x:auto; padding-bottom:4px; }
.tl-step{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:84px; position:relative; }
.tl-dot{ width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-3); font-weight:700; z-index:1; }
.tl-line{ position:absolute; top:10px; left:calc(-50% + 11px); width:calc(100% - 22px); height:2px; background:var(--border-strong); }
.tl-step:first-child .tl-line{ display:none; }
.tl-label{ font-size:10.5px; text-align:center; color:var(--ink-3); font-weight:600; line-height:1.2; }
.tl-step.done .tl-dot{ background:var(--good); border-color:var(--good); color:#fff; }
.tl-step.done .tl-line{ background:var(--good); }
.tl-step.done .tl-label{ color:var(--ink-2); }
.tl-step.current .tl-dot{ background:var(--accent); border-color:var(--accent); color:#fff; }
.tl-step.current .tl-label{ color:var(--ink); font-weight:700; }

/* ============ LEDGER ============ */
.ledger{ font-family:var(--font-mono); font-size:13px; }
.ledger-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); }
.ledger-row.total{ border-bottom:none; border-top:1px solid var(--border-strong); margin-top:2px; padding-top:10px; font-weight:700; font-size:14.5px; }
.ledger-row .amt{ font-variant-numeric:tabular-nums; }

/* ============ ACTIVITY LOG ============ */
.log{ display:flex; flex-direction:column; gap:0; }
.log-item{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
.log-item:last-child{ border-bottom:none; }
.log-ico{ width:22px; height:22px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex:none; font-size:11px; }
.log-ico.warn{ background:var(--warn-wash); color:var(--warn-ink); }
.log-time{ color:var(--ink-3); font-size:11px; }

/* ============ TOASTS ============ */
.toast-wrap{ position:fixed; bottom:18px; right:18px; z-index:80; display:flex; flex-direction:column; gap:8px; max-width:340px; }
.toast{ background:var(--surface); border:1px solid var(--border-strong); box-shadow:var(--shadow-md); border-radius:var(--r-md); padding:11px 14px; font-size:13px; display:flex; gap:9px; align-items:flex-start; animation:toastin .18s ease; }
@keyframes toastin{ from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;} }

/* ============ LOGIN ============ */
.login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
  radial-gradient(circle at 15% 12%, var(--accent-wash), transparent 42%),
  var(--page); }
.login-card{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-md); padding:34px 32px; }
.login-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
.login-opt{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); text-align:left; }
.login-opt:hover{ border-color:var(--accent); background:var(--accent-wash); }
.login-opt .g{ margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:700; }
.login-opt.admin{ grid-column:1/-1; background:var(--accent-wash); border-color:var(--accent); }
.google-btn{ display:inline-flex; align-items:center; gap:10px; padding:11px 22px; border-radius:6px; border:1px solid #dadce0; background:#fff; color:#3c4043; font-size:14px; font-weight:600; font-family:Roboto,-apple-system,sans-serif; box-shadow:0 1px 2px rgba(0,0,0,.08); transition:.16s ease; }
.google-btn:hover{ box-shadow:0 1px 4px rgba(0,0,0,.2); border-color:#c6c6c6; }
.login-card.chooser{ position:relative; padding-top:44px; }
.chooser-back{ position:absolute; top:14px; left:14px; }
.chooser-list{ display:flex; flex-direction:column; gap:2px; max-height:360px; overflow-y:auto; margin-top:6px; }
.chooser-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-sm); border:none; background:transparent; text-align:left; width:100%; cursor:pointer; }
.chooser-row:hover{ background:var(--surface-2); }
.chooser-row strong{ display:block; font-size:13.5px; font-weight:600; }
.chooser-email{ display:block; font-size:11.5px; color:var(--ink-3); }
.chooser-divider{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700; padding:10px 12px 4px; }

/* ============ SPARKBAR ============ */
.sparkbar{ display:flex; align-items:flex-end; gap:2px; height:36px; }
.sparkbar b{ flex:1; background:var(--accent); border-radius:2px 2px 0 0; opacity:.85; min-width:3px; }

/* ============ PROJECTS BOARD ============ */
.board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; align-items:flex-start; }
.board-col{ flex:none; width:240px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:10px; transition:.14s ease; }
.board-col.drag-over{ border-color:var(--accent); background:var(--accent-wash); }
.board-col-head{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); padding:2px 4px 10px; }
.board-col-count{ background:var(--surface-3); color:var(--ink-3); border-radius:999px; padding:1px 7px; font-size:10.5px; }

  else if(rng()<0.15) charges.push({id:'CH-'+randInt(1,999999), label: pick(['Travel','Hotel & Lodging']), amount:randInt(1,4)*100});
  const log = [];
  const createdOffset = -randInt(4,60);
  const created = addDays(new Date(), Math.min(createdOffset, offsetDays-2));
  log.push({ts:created, type:'system', text:`Lead created for ${artist.name} — client info entered by management.`});
  if(status!=='lead'){ log.push({ts:addDays(created,1), type:'system', text:'Status moved to Negotiating.'}); }
  if(['contract_sent','booked','paid'].includes(status)){ log.push({ts:addDays(created,3), type:'email', text:`Contract + QuickBooks invoice (15% booking fee) emailed to ${client.toLowerCase().replace(' ','.')}@example.com.`}); }
  if(depositReceived){ log.push({ts:addDays(created,6), type:'success', text:'Bookkeeping marked booking fee received — job officially booked & locked on calendar.'});
    log.push({ts:addDays(created,6), type:'email', text:'Confirmation emailed to client with date, time & location.'});
    log.push({ts:addDays(created,6), type:'email', text:`Schedule notification sent to ${artist.name}.`}); }
  if(flightNeeded){ log.push({ts:addDays(created,2), type:'system', text:'Flight needed — bookkeeping notified.'});
    if(flightBooked) log.push({ts:addDays(created,9), type:'success', text:`Flight booked & added to itinerary — ${artist.name} notified.`}); }
  if(balanceReceived){ log.push({ts:addDays(date,1), type:'success', text:'Bookkeeping marked balance received via Zelle — reminders stopped.'}); }
  return {
    id: 'EV-'+(EVID++),
    artistId: artist.id,
    type: pick(EVENT_TYPES),
    clientName: client,
    clientEmail: client.toLowerCase().replace(' ','.')+'@example.com',
    clientPhone: '(917) '+randInt(200,899)+'-'+randInt(1000,9999),
    date: fmtISO(date),
    time: startTime, endTime: endTimeVal,
    venue: v.venue, city: v.city, state: v.state,
    price, commission, balance,
    status,
    depositReceived, depositReceivedDate: depositReceived? fmtISO(addDays(created,6)): null,
    balanceReceived, balanceReceivedDate: balanceReceived? fmtISO(addDays(date,1)): null,
    reminderIntervalDays: 5,
    lastReminderSent: (status==='booked' && !balanceReceived) ? fmtISO(addDays(new Date(),-randInt(1,4))) : null,
    flightNeeded, flightBooked,
    flight: flightBooked ? {
      airline: pick(['El Al','Delta','United','American']), confirmation: 'CNF'+randInt(1000,9999),
      depart: fmtISO(addDays(date,-1))+' 14:20', arrive: fmtISO(date)+' 17:05', notes:'Round-trip, coach.'
    } : null,
    charges,
    prepSheets: [],
    createdAt: fmtISO(created),
    log: log.sort((a,b)=>a.ts-b.ts).map(l=>({...l, ts:l.ts.toISOString()})),
  };
}

/* ============ HELPERS ============ */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eventsFor(artistId){ return S.events.filter(e=>e.artistId===artistId); }
function getEvent(id){ return S.events.find(e=>e.id===id); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
function fmtTime(t){ const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; const hh=((h+11)%12)+1; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtTimeRange(start, end){ return end? `${fmtTime(start)} – ${fmtTime(end)}` : fmtTime(start); }
function addMinutesToTime(t, mins){ const [h,m]=t.split(':').map(Number); const total=(h*60+m+mins+1440)%1440; return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`; }
function daysUntil(iso){ const today=new Date(); today.setHours(0,0,0,0); const d=new Date(iso+'T00:00:00'); return Math.round((d-today)/86400000); }
function isPast(iso){ return daysUntil(iso) < 0; }
function fullLocation(ev){ return `${ev.venue}, ${ev.city}, ${ev.state}`; }
const US_STATES = new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC']);
function isInternational(ev){ return !US_STATES.has((ev.state||'').trim().toUpperCase()); }
function eventTravelDates(ev){
  const dates = new Set([ev.date]);
  if(ev.flight){
    if(ev.flight.depart) dates.add(ev.flight.depart.slice(0,10));
    if(ev.flight.arrive) dates.add(ev.flight.arrive.slice(0,10));
  }
  return dates;
}
function findConflicts(ev){
  const myDates = eventTravelDates(ev);
  return S.events.filter(e=>{
    if(e.id===ev.id || e.artistId!==ev.artistId) return false;
    const otherDates = eventTravelDates(e);
    for(const d of myDates) if(otherDates.has(d)) return true;
    return false;
  });
}
function allConflictPairs(){
  const seen = new Set(); const pairs = [];
  S.events.forEach(ev=>{
    findConflicts(ev).forEach(other=>{
      const key = [ev.id, other.id].sort().join('|');
      if(!seen.has(key)){ seen.add(key); pairs.push([ev, other]); }
    });
  });
  return pairs;
}
function statusMeta(ev){
  const map = {
    lead:      {label:'New Lead', cls:'pill-neutral'},
    negotiating:{label:'Negotiating', cls:'pill-warn'},
    contract_sent:{label:'Contract Sent', cls:'pill-warn'},
    booked:    {label: ev.balanceReceived? 'Paid in Full':'Booked · Balance Pending', cls: ev.balanceReceived? 'pill-good':'pill-accent'},
    paid:      {label: isPast(ev.date)?'Completed':'Paid in Full', cls:'pill-good'},
  };
  return map[ev.status] || {label:ev.status, cls:'pill-neutral'};
}
function toast(msg, type){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className='toast';
  const ic = type==='email'? ICO.mail : type==='success'? ICO.check : ICO.bell;
  el.innerHTML = `<span style="color:var(--accent);margin-top:1px;">${ic}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='.25s ease'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),260); }, 4200);
}

function gcalUrl(ev){
  const artist = artistById(ev.artistId);
  const start = ev.date.replace(/-/g,'')+'T'+ev.time.replace(':','')+'00';
  const endDate = ev.endTime ? new Date(ev.date+'T'+ev.endTime+':00') : new Date(ev.date+'T'+ev.time+':00');
  if(!ev.endTime) endDate.setHours(endDate.getHours()+3);
  const end = endDate.toISOString().slice(0,19).replace(/[-:]/g,'').replace('T','T');
  const details = `${ev.type} for ${artist.name}. Client: ${ev.clientName}. Booked via ASP.`;
  const params = new URLSearchParams({action:'TEMPLATE', text:`${artist.name} — ${ev.type}`, dates:`${start}/${end}`, details, location:fullLocation(ev)});
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function downloadIcs(ev){
  const artist = artistById(ev.artistId);
  const start = ev.date.replace(/-/g,'')+'T'+ev.time.replace(':','')+'00';
  const endDate = ev.endTime ? new Date(ev.date+'T'+ev.endTime+':00') : new Date(ev.date+'T'+ev.time+':00');
  if(!ev.endTime) endDate.setHours(endDate.getHours()+3);
  const end = endDate.toISOString().slice(0,19).replace(/[-:]/g,'');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',`UID:${ev.id}@asp-bookings`,`DTSTART:${start}`,`DTEND:${end}`,`SUMMARY:${artist.name} — ${ev.type}`,`LOCATION:${fullLocation(ev)}`,`DESCRIPTION:Client ${ev.clientName}. Booked via ASP.`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${artist.name.replace(/\s/g,'_')}_${ev.date}.ics`; a.click();
}

function exportCSV(){
  const filt = S.finArtistFilter==='all' ? S.events : S.events.filter(e=>e.artistId===S.finArtistFilter);
  const rows = filt.filter(e=>['booked','paid'].includes(e.status));
  const cols = ['Artist','Client','Date','Type','Venue','City','State','Price','Charges','Commission','Payout','Status'];
  const csvEsc = (v)=>{ const s=String(v??''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [cols.join(',')];
  rows.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const a = artistById(e.artistId); const sm = statusMeta(e);
    lines.push([a.name, e.clientName, e.date, e.type, e.venue, e.city, e.state, e.price, chargesTotal(e), e.commission, e.balance+chargesTotal(e), sm.label].map(csvEsc).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `asp-bookings-${S.finArtistFilter}-${fmtISO(new Date())}.csv`; a.click();
  toast('CSV exported.', 'system');
}

function sameMonth(iso){ if(!iso) return false; const d=new Date(iso+'T00:00:00'); const n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
function statTile(label, val, sub, view){
  const clickable = view ? `style="cursor:pointer;" data-action="nav" data-view="${view}"` : '';
  return `<div class="card stat-tile" ${clickable}>
    <span class="u-label">${label}</span><span class="val">${val}</span><span class="sub">${sub}</span></div>`;
}

/* ============ CALENDAR ============ */
function renderCalendarPage(events, opts={}){
  const month = S.calMonth;
  const y = month.getFullYear(), m = month.getMonth();
  const first = new Date(y,m,1); const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const filtered = (S.calArtistFilter.length && !opts.compact) ? events.filter(e=>S.calArtistFilter.includes(e.artistId)) : events;
  const byDate = {};
  filtered.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  const todayIso = fmtISO(new Date());
  const cells=[];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, out:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({d, out:false, iso: `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7!==0) cells.push({d:cells.length, out:true});

  const monthLabel = month.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  return `
    <div class="cal-head">
      <div class="cal-nav">
        <button class="icon-btn" data-action="cal-prev">${ICO.chev('l')}</button>
        <strong style="font-family:var(--font-display);font-size:1.05rem;min-width:150px;text-align:center;">${monthLabel}</strong>
        <button class="icon-btn" data-action="cal-next">${ICO.chev('r')}</button>
        <button class="btn btn-sm btn-ghost" data-action="cal-today">Today</button>
      </div>
      ${opts.showFilter ? `<div class="chip-row">${ARTISTS.map(a=>`<button class="filter-chip ${S.calArtistFilter.includes(a.id)?'sel':''}" data-action="cal-filter" data-id="${a.id}"><span class="dot" data-slot="${a.slot}"></span>${a.name.split(' ')[0]}</button>`).join('')}</div>`:''}
    </div>
    <div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.out) return `<div class="cal-cell out"><span class="cal-date">${c.d}</span></div>`;
        const evs = (byDate[c.iso]||[]).sort((a,b)=>a.time.localeCompare(b.time));
        const max = opts.compact?2:3;
        return `<div class="cal-cell ${c.iso===todayIso?'today':''}">
          <span class="cal-date">${c.d}</span>
          ${evs.slice(0,max).map(e=>{const a=artistById(e.artistId); const label = opts.singleArtist? e.clientName.split(' ')[0] : a.name.split(' ')[0]; return `<div class="cal-evt" data-action="open-event" data-id="${e.id}"><span class="dot" data-slot="${a.slot}"></span><span>${fmtTime(e.time).replace(':00','')} ${esc(label)}</span></div>`;}).join('')}
          ${evs.length>max? `<span class="cal-more" data-action="open-day" data-date="${c.iso}">+${evs.length-max} more</span>`:''}
        </div>`;
      }).join('')}
    </div>
    ${(!opts.compact && !opts.noLegend) ? `<div class="legend">${ARTISTS.map(a=>`<span class="legend-item"><span class="dot" data-slot="${a.slot}"></span>${a.name}</span>`).join('')}</div>`:''}
  `;
}

/* ============ FINANCIALS ============ */
function renderFinancialsPage(){
  const filt = S.finArtistFilter==='all' ? S.events : S.events.filter(e=>e.artistId===S.finArtistFilter);
  const booked = filt.filter(e=>['booked','paid'].includes(e.status));
  const gross = booked.reduce((s,e)=>s+e.price,0);
  const commission = booked.reduce((s,e)=>s+e.commission,0);
  const payouts = booked.reduce((s,e)=>s+e.balance,0);
  const avg = booked.length ? Math.round(gross/booked.length) : 0;

  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d); }
  const monthlyGross = months.map(md=>{
    const sum = booked.filter(e=>{const ed=new Date(e.date+'T00:00:00'); return ed.getMonth()===md.getMonth()&&ed.getFullYear()===md.getFullYear();}).reduce((s,e)=>s+e.price,0);
    return {label: md.toLocaleDateString('en-US',{month:'short'}), val:sum};
  });
  const maxMonthly = Math.max(...monthlyGross.map(m=>m.val),1);

  return `
  <div class="chip-row" style="margin-bottom:16px;">
    <button class="filter-chip ${S.finArtistFilter==='all'?'sel':''}" data-action="fin-filter" data-id="all">All Artists</button>
    ${ARTISTS.map(a=>`<button class="filter-chip ${S.finArtistFilter===a.id?'sel':''}" data-action="fin-filter" data-id="${a.id}"><span class="dot" data-slot="${a.slot}"></span>${a.name.split(' ')[0]}</button>`).join('')}
  </div>
  <div class="grid stat-row" style="margin-bottom:20px;">
    <div class="card stat-tile"><span class="u-label">Gross Booked</span><span class="val">${money(gross)}</span><span class="sub">${booked.length} jobs</span></div>
    <div class="card stat-tile"><span class="u-label">ASP Commission</span><span class="val">${money(commission)}</span><span class="sub">15% of gross</span></div>
    <div class="card stat-tile"><span class="u-label">Artist Payouts</span><span class="val">${money(payouts)}</span><span class="sub">85% via Zelle</span></div>
    <div class="card stat-tile"><span class="u-label">Avg Job Size</span><span class="val">${money(avg)}</span><span class="sub">per booking</span></div>
  </div>

  <div class="card card-pad" style="margin-bottom:20px;">
    <div class="section-head"><h2>Monthly Gross Revenue</h2></div>
    <div style="display:flex;gap:14px;align-items:flex-end;height:120px;">
      ${monthlyGross.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <span class="u-mono" style="font-size:11px;color:var(--ink-2);">${m.val?money(m.val):''}</span>
        <div style="width:100%;max-width:46px;height:${Math.max(4,(m.val/maxMonthly)*80)}px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85;"></div>
        <span class="u-label">${m.label}</span>
      </div>`).join('')}
    </div>
  </div>

  <div class="section-head"><h2>Per-Artist Trend</h2></div>
  <div class="grid grid-3" style="margin-bottom:22px;">
    ${ARTISTS.map(a=>{
      const ae = S.events.filter(e=>e.artistId===a.id && ['booked','paid'].includes(e.status));
      const total = ae.reduce((s,e)=>s+e.price,0);
      const spark = months.map(md=>ae.filter(e=>{const ed=new Date(e.date+'T00:00:00'); return ed.getMonth()===md.getMonth()&&ed.getFullYear()===md.getFullYear();}).reduce((s,e)=>s+e.price,0));
      const mx = Math.max(...spark,1);
      return `<div class="card card-pad">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span class="avatar" data-slot="${a.slot}" style="width:26px;height:26px;font-size:10px;">${a.initials}</span>
          <strong style="font-size:13px;">${esc(a.name)}</strong>
        </div>
        <div class="sparkbar">${spark.map(v=>`<b style="height:${Math.max(6,(v/mx)*100)}%;"></b>`).join('')}</div>
        <div class="u-mono" style="font-size:15px;font-weight:700;margin-top:6px;">${money(total)}</div>
        <span class="u-label">gross, last 6 mo</span>
      </div>`;
    }).join('')}
  </div>

  <div class="section-head"><h2>All Jobs (${booked.length})</h2><button class="btn btn-sm" data-action="export-csv">${ICO.leads} Export CSV</button></div>
  <div class="card u-scroll-x"><table>
    <thead><tr><th>Artist</th><th>Client</th><th>Date</th><th>Price</th><th>Commission</th><th>Payout</th><th>Status</th></tr></thead>
    <tbody>${booked.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const a=artistById(e.artistId); const sm=statusMeta(e);
      return `<tr class="row-link" data-action="open-event" data-id="${e.id}">
        <td>${esc(a.name)}</td><td>${esc(e.clientName)}</td><td class="u-mono">${fmtDateShort(e.date)}</td>
        <td class="u-mono">${money(e.price)}</td><td class="u-mono">${money(e.commission)}</td><td class="u-mono">${money(e.balance)}</td>
        <td><span class="pill ${sm.cls}">${sm.label}</span></td></tr>`;}).join('')}
    </tbody></table></div>

function renderArtistDashboard(artistId){
  const a = artistById(artistId);
  const evs = eventsFor(artistId);
  const upcoming = evs.filter(e=>!isPast(e.date) && ['booked','paid'].includes(e.status)).sort((x,y)=>x.date.localeCompare(y.date));
  const next = upcoming[0];
  const ytd = evs.filter(e=>e.balanceReceived && new Date(e.balanceReceivedDate).getFullYear()===new Date().getFullYear()).reduce((s,e)=>s+e.balance,0);
  return `
  <div class="grid stat-row" style="margin-bottom:20px;">
    ${statTile('Upcoming Gigs', upcoming.length, 'Booked & confirmed')}
    ${statTile('Next Gig', next? `${daysUntil(next.date)}d`: '—', next? fmtDateShort(next.date): 'Nothing scheduled')}
    ${statTile('YTD Payout', money(ytd), 'Received via Zelle')}
    ${statTile('Flights Pending', evs.filter(e=>e.flightNeeded&&!e.flightBooked&&!isPast(e.date)).length, 'Awaiting bookkeeping')}
  </div>
  <div class="card card-pad">${renderCalendarPage(evs, {noLegend:true, singleArtist:true})}</div>
  `;
}
function renderArtistGigs(artistId){
  const evs = eventsFor(artistId).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = evs.filter(e=>!isPast(e.date));
  const past = evs.filter(e=>isPast(e.date));
  return `
    <div class="section-head"><h2>Upcoming</h2></div>
    ${renderEventTable(upcoming, {})}
    <div class="section-head" style="margin-top:26px;"><h2>Past</h2></div>
    ${renderEventTable(past, {})}
  `;
}

    {key:'booked', label:'Booked'}, {key:'paid', label:'Paid in Full'},

  const order = ['lead','negotiating','contract_sent','booked','paid'];
  const curIdx = ev.status==='paid' ? 4 : order.indexOf(ev.status);

  return `<div class="overlay" data-action="overlay-close">
    <div class="sheet" data-stop>
      <div class="sheet-head">
        <div style="display:flex;align-items:center;gap:10px;">

        </div>
      </div>
      <div class="sheet-body">

        <div class="timeline">
          ${steps.map((s,i)=>`<div class="tl-step ${i<curIdx?'done':''} ${i===curIdx?'current':''}"><span class="tl-line"></span>
            <span class="tl-dot">${i<curIdx?ICO.check:i+1}</span><span class="tl-label">${s.label}</span></div>`).join('')}

        <div class="card card-pad" style="display:flex;flex-direction:column;gap:9px;">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--ink-2);">${ICO.pin} Client</span><strong>${esc(ev.clientName)}</strong></div>
          <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--ink-2);">Type</span><strong>${esc(ev.type)}</strong></div>

          <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--ink-2);">${ICO.pin} Venue</span><strong style="text-align:right;">${esc(ev.venue)}<br/><span style="font-weight:500;color:var(--ink-2);">${esc(ev.city)}, ${esc(ev.state)}</span></strong></div>
          ${isAdmin?`<div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--ink-2);">${ICO.mail} Contact</span><strong style="text-align:right;">${esc(ev.clientEmail)}<br/><span style="font-weight:500;color:var(--ink-2);">${esc(ev.clientPhone)}</span></strong></div>`:''}
        </div>

        ${renderFlightBlock(ev, isAdmin)}

    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">
      ${conflicts.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--crit-ink);cursor:pointer;" data-action="open-event" data-id="${c.id}">

        <span style="text-decoration:underline;">View</span>
      </div>`).join('')}

  </div>`;
}

  if(!ev.flightBooked){

function doAddCharge(id){
  const f = S.addChargeForm;
  const preset = f.preset || CHARGE_PRESETS[0];
  const label = preset==='Other' ? (f.customLabel||'').trim() : preset;
  const amount = Number(f.amount);
  if(!label || !amount || amount<=0){ toast('Enter a charge type and an amount.', 'system'); return; }
  const ev = getEvent(id);
  const postSigning = ev.depositReceived;
  ev.charges = ev.charges || [];
  ev.charges.push({id:'CH-'+Date.now(), label, amount, addedAfterSigning: postSigning});
  logEvent(ev,'system',`Charge added: ${label} (${money(amount)}).`);
  if(postSigning){
    const newTotal = ev.price + chargesTotal(ev);
    logEvent(ev,'warning',`Added after signing — client's total changed. New total: ${money(newTotal)}.`);
    logEvent(ev,'email',`Updated total emailed to client: ${money(newTotal)} (was ${money(newTotal-amount)}).`);
  }
  saveEvents(); S.showAddCharge=false; S.addChargeForm={};
  toast(postSigning? 'Charge added — client notified of the updated total.' : 'Charge added to contract.', 'system');
  openEvent(id);
}
function doRemoveCharge(id, chargeId){
  const ev = getEvent(id);
  const removed = (ev.charges||[]).find(c=>c.id===chargeId);
  ev.charges = (ev.charges||[]).filter(c=>c.id!==chargeId);
  if(removed) logEvent(ev,'system',`Charge removed: ${removed.label} (${money(removed.amount)}).`);
  saveEvents(); openEvent(id);
}
function doUploadPrep(id, files){
  const ev = getEvent(id);
  ev.prepSheets = ev.prepSheets || [];
  let remaining = files.length;
  Array.from(files).forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      ev.prepSheets.push({id:'PS-'+Date.now()+Math.random().toString(36).slice(2,6), name:file.name, dataUrl:reader.result, uploadedAt:fmtISO(new Date())});
      remaining--;
      if(remaining===0){
        logEvent(ev,'system', files.length>1? `${files.length} prep sheets uploaded.` : `Prep sheet uploaded: ${files[0].name}.`);
        saveEvents(); toast('Prep sheet uploaded — artist notified.', 'success'); openEvent(id);
      }
    };
    reader.readAsDataURL(file);
  });
}

function doShareEvent(id){

function doAddArtist(){
  const name = (S.addArtistForm.name||'').trim();
  if(!name){ toast('Enter a name.', 'system'); return; }
  const parts = name.split(/\s+/);
  const first = parts[0].toLowerCase().replace(/[^a-z]/g,'');
  const last = (parts[1]||'').toLowerCase().replace(/[^a-z]/g,'');
  let id = first || 'artist';
  if(ARTISTS.some(a=>a.id===id)) id = first + (last? last[0] : '');
  let uniq = id, n = 2;
  while(ARTISTS.some(a=>a.id===uniq)){ uniq = id + n; n++; }
  id = uniq;
  const email = `${first}${last? '.'+last : ''}@aspmanagement.com`;
  const initials = (parts[0][0] + (parts[1]? parts[1][0] : '')).toUpperCase();
  const slot = (ARTISTS.length % 6) + 1;
  const artist = {id, name, slot, initials, email};
  ARTISTS.push(artist); saveArtists();
  S.showAddArtist = false; S.addArtistForm = {};
  S.newArtistWelcome = {name, email};
  toast(`${name} added — welcome email sent to ${email}.`, 'email');
  render();
}

function doSubmitLead(){
  const f = S.newLeadForm;
  if(!f.artistId || !f.clientName || !f.date || !f.venue || !f.city || !f.price){ toast('Please fill in artist, client, date, venue, city and price.', 'system'); return; }
  const price = Number(f.price); const commission = Math.round(price*0.15);
  const ev = {
    id:'EV-'+(EVID++), artistId:f.artistId, type: f.type||EVENT_TYPES[0], clientName:f.clientName,
    clientEmail: f.clientEmail||'', clientPhone: f.clientPhone||'', date: f.date, time: f.time||'19:00', endTime: f.endTime||null,
    venue: f.venue, city: f.city, state: f.state||'',
    price, commission, balance: price-commission, status:'lead', depositReceived:false, depositReceivedDate:null,
    balanceReceived:false, balanceReceivedDate:null, reminderIntervalDays:5, lastReminderSent:null,
    flightNeeded: !!f.flightNeeded, flightBooked:false, flight:null, charges:[], prepSheets:[], createdAt: fmtISO(new Date()),
    log:[{ts:new Date().toISOString(), type:'system', text:`Lead created for ${artistById(f.artistId).name} — client info entered by management.`}],
  };
  S.events.unshift(ev); saveEvents();
  toast(`Lead added — penciled in on ${artistById(f.artistId).name}'s calendar.`, 'success');
  if(findConflicts(ev).length) toast(`⚠ Scheduling conflict — ${artistById(f.artistId).name} already has something this date.`, 'system');
  S.showNewLead=false; S.newLeadForm={}; openEvent(ev.id);
}

/* ============ EVENT BINDING ============ */
function bindGlobal(){
  const staleFlight = document.getElementById('flightOverlayHost');
  if(staleFlight) staleFlight.remove();
  if(S.showFlightForm){
    const holder = document.createElement('div');
    holder.id = 'flightOverlayHost';
    holder.innerHTML = renderFlightFormOverlay();
    document.body.appendChild(holder);
  }
  const staleContract = document.getElementById('contractPrintHost');
  if(staleContract) staleContract.remove();
  if(S.showContract){
    const holder = document.createElement('div');
    holder.id = 'contractPrintHost';
    holder.innerHTML = renderContractDoc();
    document.body.appendChild(holder);
  }
  document.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', e=>{
      const key = el.getAttribute('data-field');
      const form = el.closest('[data-form]')?.getAttribute('data-form');
      if(form==='task'){ S.newTaskText = el.value; return; }
      if(form==='comment'){ S.newCommentText = el.value; return; }
      const formTargets = { flight:S.flightForm, charge:S.addChargeForm, addartist:S.addArtistForm, newproject:S.newProjectForm };
      const target = formTargets[form] || S.newLeadForm;
      target[key] = el.type==='checkbox'? el.checked : el.value;
    });
  });
  document.body.onclick = (e)=>{
    const t = e.target.closest('[data-action]');
    if(S.showEventMenu && !e.target.closest('.kebab-menu-wrap')){
      S.showEventMenu = false;
      if(!t){ render(); return; }
    }
    if(!t) return;
    const action = t.getAttribute('data-action');
    const id = t.getAttribute('data-id');
    if(action==='overlay-close' && e.target===t){ closeSheet(); return; }
    if(action==='overlay-close') return;
    switch(action){
      case 'login': S.user = t.getAttribute('data-user'); S.view = isAdminUser(S.user)?'dashboard':'a_dashboard'; S.showChooser=false; render(); break;
      case 'logout': S.user=null; S.eventId=null; S.showNewLead=false; S.showChooser=false; render(); break;
      case 'show-chooser': S.showChooser=true; render(); break;
      case 'hide-chooser': S.showChooser=false; render(); break;
      case 'nav': navigate(t.getAttribute('data-view')); break;
      case 'open-event': openEvent(id); break;
      case 'open-day': closeAllOverlays(); S.dayListDate = t.getAttribute('data-date'); render(); break;
      case 'close-daylist': S.dayListDate = null; render(); break;
      case 'dayoverlay-close': if(e.target===t){ S.dayListDate=null; render(); } break;
      case 'open-event-from-day': S.dayListDate = null; openEvent(id); break;
      case 'open-artist': navigate('artist_detail', {artistDetailId:id}); break;
      case 'open-new-lead': closeAllOverlays(); S.newLeadForm={date:'',time:'19:00'}; S.showNewLead=true; render(); break;
      case 'close-sheet': closeSheet(); break;
      case 'pick-artist': S.newLeadForm.artistId = id; render(); break;
      case 'submit-lead': doSubmitLead(); break;
      case 'cal-prev': S.calMonth.setMonth(S.calMonth.getMonth()-1); render(); break;
      case 'cal-next': S.calMonth.setMonth(S.calMonth.getMonth()+1); render(); break;
      case 'cal-today': S.calMonth = (()=>{const d=new Date(); d.setDate(1); return d;})(); render(); break;
      case 'cal-filter': {
        const i = S.calArtistFilter.indexOf(id);
        if(i>-1) S.calArtistFilter.splice(i,1); else S.calArtistFilter.push(id);
        render(); break;
      }
      case 'fin-filter': S.finArtistFilter = id; render(); break;
      case 'send-contract': doSendContract(id); break;
      case 'mark-deposit': doMarkDeposit(id); break;
      case 'toggle-flight': doToggleFlight(id); break;
      case 'open-flight-form': S.flightForm={}; S.showFlightForm=true; render(); break;
      case 'close-flight-form': S.showFlightForm=false; render(); break;
      case 'flight-overlay-close': if(e.target===t) { S.showFlightForm=false; render(); } break;
      case 'save-flight': doSaveFlight(id); break;
      case 'toggle-add-charge': S.showAddCharge=!S.showAddCharge; S.addChargeForm={}; render(); break;
      case 'confirm-add-charge': doAddCharge(id); break;
      case 'remove-charge': doRemoveCharge(id, t.getAttribute('data-chargeid')); break;
      case 'remove-prep': doRemovePrep(id, t.getAttribute('data-prepid')); break;
      case 'view-contract': S.showContract=true; render(); break;
      case 'close-contract': S.showContract=false; render(); break;
      case 'contract-overlay-close': if(e.target===t) { S.showContract=false; render(); } break;
      case 'print-contract': window.print(); break;
      case 'send-reminder': doSendReminder(id); break;
      case 'mark-balance': doMarkBalance(id); break;
      case 'gcal': window.open(gcalUrl(getEvent(id)), '_blank'); break;
      case 'ics': downloadIcs(getEvent(id)); break;
      case 'reset-demo': if(confirm('Reset all demo data back to the seeded example set?')) resetDemo(); break;
      case 'export-csv': exportCSV(); break;
      case 'filter-project-type': S.projectTypeFilter = t.getAttribute('data-type'); render(); break;
      case 'open-project': closeAllOverlays(); S.projectId = id; render(); break;
      case 'close-project': S.projectId = null; S.showDraftUpdate=false; render(); break;
      case 'overlay-close-project': if(e.target===t){ S.projectId=null; S.showDraftUpdate=false; render(); } break;
      case 'set-project-stage': doSetProjectStage(id, t.getAttribute('data-stage')); break;
      case 'toggle-task': doToggleTask(id, t.getAttribute('data-taskid')); break;
      case 'remove-task': doRemoveTask(id, t.getAttribute('data-taskid')); break;
      case 'add-task': doAddTask(id); break;
      case 'set-project-tab': S.projectTab = t.getAttribute('data-tab'); render(); break;
      case 'add-comment': doAddComment(id); break;
      case 'draft-update': S.showDraftUpdate = true; render(); break;
      case 'cancel-draft-update': S.showDraftUpdate = false; render(); break;
      case 'send-project-update': doSendProjectUpdate(id); break;
      case 'open-new-project': closeAllOverlays(); S.newProjectForm={type:'Album'}; S.showNewProject=true; render(); break;
      case 'close-new-project': S.showNewProject=false; render(); break;
      case 'overlay-close-newproject': if(e.target===t){ S.showNewProject=false; render(); } break;
      case 'pick-project-artist': S.newProjectForm.artistId = id; render(); break;
      case 'pick-project-type': S.newProjectForm.type = t.getAttribute('data-type'); render(); break;
      case 'confirm-add-project': doAddProject(); break;
      case 'open-add-artist': closeAllOverlays(); S.addArtistForm={}; S.showAddArtist=true; render(); break;
      case 'close-add-artist': S.showAddArtist=false; render(); break;
      case 'overlay-close-addartist': if(e.target===t){ S.showAddArtist=false; render(); } break;
      case 'confirm-add-artist': doAddArtist(); break;
      case 'close-welcome': S.newArtistWelcome=null; render(); break;
      case 'overlay-close-welcome': if(e.target===t){ S.newArtistWelcome=null; render(); } break;
      case 'toggle-event-menu': S.showEventMenu = !S.showEventMenu; render(); break;
      case 'share-event': doShareEvent(id); break;
      case 'delete-event': doDeleteEvent(id); break;
      case 'install-app': if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt=null; }); } break;
      case 'dismiss-install': localStorage.setItem('aspInstallDismissedAt', String(Date.now())); S.showInstallBanner=false; render(); break;
    }
  };
  document.querySelectorAll('[data-action="set-reminder-interval"]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ const ev=getEvent(sel.getAttribute('data-id')); ev.reminderIntervalDays=Number(sel.value); saveEvents(); toast('Reminder interval updated.', 'system'); });
  });
  document.querySelectorAll('[data-charge-preset]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ S.addChargeForm.preset = sel.value; render(); });
  });
  document.querySelectorAll('[data-action="upload-prep"]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ if(inp.files.length) doUploadPrep(inp.getAttribute('data-id'), inp.files); });
  });
  document.querySelectorAll('.board-card[draggable]').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ S.dragProjectId = card.getAttribute('data-project-id'); });
  });
  document.querySelectorAll('.board-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
    col.addEventListener('drop', (e)=>{
      e.preventDefault(); col.classList.remove('drag-over');
      if(S.dragProjectId){ doSetProjectStage(S.dragProjectId, col.getAttribute('data-stage')); S.dragProjectId = null; }
    });
  });
}

render();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
